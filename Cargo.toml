[package]
name = "scig"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu      = "30"
bytemuck  = { version = "1", features = ["derive"] }
log       = "0.4"
thiserror = "2"
winit     = { version = "0.30", optional = true }
pollster  = { version = "1",    optional = true }
image     = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
tobj      = { version = "4",    optional = true }
notify    = { version = "8",    optional = true }
anyhow = "1.0.104"
bitflags = "2.13.2"
tokio = { version = "1.53", features = ["rt", "macros"] }
parameterized = "2.1.0"
nalgebra = "0.35"

[features]
default    = ["passes", "assets", "winit"]
passes     = []
winit      = ["dep:winit", "dep:pollster"]
assets     = ["dep:image", "dep:tobj"]
hot-reload = ["dep:notify"]

[dev-dependencies]
nalgebra = { version = "0.35", features = ["mint"] }
